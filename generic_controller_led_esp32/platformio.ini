[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 500000
upload_speed = 921600

lib_deps =
    fastled/FastLED@3.10.9
    z3t0/IRremote@4.7.1

; The firmware uses C++17 language features and only needs the NEC IR protocol.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DECODE_NEC
